services:
  db:
    image: postgres:17.11
    container_name: meubolso-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: meubolso
      POSTGRES_PASSWORD: meubolso
      POSTGRES_DB: meubolso
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
